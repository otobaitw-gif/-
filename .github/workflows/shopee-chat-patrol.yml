name: Shopee Chat Patrol

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run patrol
        env:
          SHOPEE_AUTH_TOKEN: ${{ secrets.SHOPEE_AUTH_TOKEN }}
        run: python patrol.py
